name: publish
# Publishes to npm from CI only, with provenance, when a GitHub release is published. Uses npm
# trusted publishing: no npm token, the id-token permission below is the credential.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches package.json
        # The tag goes through an env var, never straight into the script, so a tag name can't inject shell.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      # Trusted publishing (OIDC): npm trusts this workflow directly, so no long-lived npm token
      # exists to steal. Needs npm 11.5.1 or later. --ignore-scripts: typecheck and tests already
      # ran above, and nothing should run next to publish credentials.
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public --ignore-scripts
