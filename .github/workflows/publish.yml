name: publish
# Publishes to npm from CI only, with provenance, when a GitHub release is published. Uses npm
# trusted publishing: no npm token, the publish job's id-token permission is the credential.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Typecheck and tests run dev-dependency code (vitest, vite, and their dependencies), so they
  # run here, in a job that holds no id-token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Holds the id-token. Runs no dependency code except the TypeScript compiler: no install
  # scripts, no test runner, no shared cache.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        # The tag goes through an env var, never straight into the script, so a tag name can't inject shell.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # Trusted publishing needs npm 11.5.1 or later; the version is exact so an npm release can't
      # change what runs next to the id-token.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm pack --ignore-scripts
      - run: npm publish ./*.tgz --provenance --access public --ignore-scripts
