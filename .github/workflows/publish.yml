name: publish
# Ships each version as a GitHub release asset: the packed package, with a signed build
# attestation. No npm and no tokens: apps install the tarball URL, pinned by hash in their
# lockfile, and verify the attestation with `gh attestation verify`.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Typecheck and tests run dev-dependency code (vitest, vite, and their dependencies), so they
  # run here, in a job that can't write anything.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Builds, attests, and uploads. Runs no dependency code except the TypeScript compiler: no
  # install scripts, no test runner, no shared cache.
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset to this release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        # The tag goes through an env var, never straight into the script, so a tag name can't inject shell.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: npm pack --ignore-scripts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.tgz --repo "$GITHUB_REPOSITORY"
